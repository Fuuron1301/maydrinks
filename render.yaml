services:
  - type: web
    name: maydrinks-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        value: https://maydrinks.surge.sh
      - key: CORS_ORIGINS
        value: https://maydrinks.surge.sh
      - key: MAIL_MODE
        value: brevo
      - key: SQLSERVER_CONNECTION_STRING
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
